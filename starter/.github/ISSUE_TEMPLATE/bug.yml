name: Bug
description: Something that works wrong. Search for an existing issue first.
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, input, and where (commit SHA, URL, app version).
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — broken or unsafe for users; drop everything
        - P1 — serious; fix before the next release
        - P2 — real, can wait
        - P3 — minor
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Error output, screenshot, failing test name.
